[package]
name = "tor-taxi-checker"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Out-of-band onion link prober. Runs next to a Tor daemon and writes status into D1."

[dependencies]
anyhow.workspace = true
serde.workspace = true
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["socks", "json", "http2", "charset", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
futures = "0.3"
humantime = "2"
serde_json = "1"
toml = "0.9"
