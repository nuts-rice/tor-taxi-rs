name = "tor-taxi-rs-worker"
main = "build/index.js"
compatibility_date = "2026-09-08"
workers_dev = true          
routes = [
  { pattern = "tor-rs.cab",     custom_domain = true },
  { pattern = "www.tor-rs.cab", custom_domain = true },
]

# worker-build is pinned exactly. 0.8.4+ pass --force-enable-abort-handler to
# wasm-bindgen, which then needs catch wrappers and fails this build with
# "externref table required for catch wrappers".
[build]
command = "cargo leptos build --release && cargo install -q \"worker-build@=0.8.3\" && LEPTOS_OUTPUT_NAME=tor-taxi-rs-worker worker-build --release --features ssr"

[assets]
directory = "../../target/site"

[[d1_databases]]
binding = "prod_links"
database_name = "prod-links"
database_id = "e068c0b1-827b-408d-9e94-220ba77d6c33"


[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
